name: EGFR MLOps checks

on:
  push:
    paths:
      - "mlops/**"
      - "data/processed/egfr_ic50_raw.csv"
      - ".github/workflows/mlops.yml"
  pull_request:
    paths:
      - "mlops/**"
      - "data/processed/egfr_ic50_raw.csv"
      - ".github/workflows/mlops.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install -r mlops/requirements-api.txt
          python -m pip install pytest==9.1.1 mlflow==3.17.2

      - name: Train and record run
        run: |
          python mlops/fit.py
          RUN_ID=$(basename "$(find mlops/artifacts/runs -mindepth 1 -maxdepth 1 -type d | sort | tail -1)")
          echo "EXPECTED_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "MODEL_PATH=mlops/artifacts/runs/$RUN_ID/model.joblib" >> "$GITHUB_ENV"

      - name: Test saved model and data fingerprint
        run: python -m pytest mlops/test_model.py -q

      - name: Build API container
        run: |
          docker build -f mlops/Dockerfile \
            --build-arg RUN_ID="$EXPECTED_RUN_ID" \
            -t egfr-qsar-api:ci .

      - name: Start container and wait for readiness
        run: |
          docker run -d --name egfr-ci \
            -p 127.0.0.1:8001:8000 egfr-qsar-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8001/openapi.json > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs egfr-ci
          exit 1

      - name: Test API
        run: python -m pytest mlops/test_api.py -q

      - name: Build SageMaker container
        run: |
          docker build -f mlops/Dockerfile.sagemaker \
            --build-arg RUN_ID="$EXPECTED_RUN_ID" \
            -t egfr-sagemaker:ci .

      - name: Start SageMaker container and wait for readiness
        run: |
          docker run -d --name egfr-sm-ci \
            -p 127.0.0.1:8002:8080 egfr-sagemaker:ci serve
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8002/ping > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs egfr-sm-ci
          exit 1

      - name: Test SageMaker inference and health
        env:
          API_URL: http://127.0.0.1:8002/invocations
          HEALTH_URL: http://127.0.0.1:8002/ping
        run: python -m pytest mlops/test_api.py -q

      - name: Upload training evidence
        uses: actions/upload-artifact@v4
        with:
          name: egfr-training-evidence
          path: |
            mlops/artifacts/runs/*/metrics.json
            mlops/artifacts/runs/*/data_manifest.json
            mlops/artifacts/runs/*/environment.json
            mlops/artifacts/runs/*/split_assignments.csv
          if-no-files-found: error
          retention-days: 7

      - name: Show container logs and clean up
        if: always()
        run: |
          docker logs egfr-ci || true
          docker rm -f egfr-ci || true
          docker logs egfr-sm-ci || true
          docker rm -f egfr-sm-ci || true
