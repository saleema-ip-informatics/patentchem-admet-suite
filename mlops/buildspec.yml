version: 0.2

env:
  variables:
    EXPECTED_RUN_ID: "20261021T114548349412Z"
    API_URL: "http://127.0.0.1:8002/invocations"
    HEALTH_URL: "http://127.0.0.1:8002/ping"

phases:
  install:
    commands:
      - python3 -m pip install pytest==9.1.1

  pre_build:
    commands:
      - docker info

  build:
    commands:
      - docker build --platform linux/amd64 --provenance=false -f mlops/Dockerfile.sagemaker --build-arg RUN_ID="$EXPECTED_RUN_ID" -t egfr-sagemaker:codebuild .
      - docker run -d --name egfr-codebuild -p 127.0.0.1:8002:8080 egfr-sagemaker:codebuild serve
      - |
        ready=false
        for attempt in $(seq 1 30); do
          if curl --fail --silent "$HEALTH_URL" > /dev/null; then
            ready=true
            break
          fi
          sleep 2
        done
        if [ "$ready" != "true" ]; then
          docker logs egfr-codebuild
          exit 1
        fi
      - python3 -m pytest mlops/test_api.py -q
    finally:
      - docker logs egfr-codebuild || true
      - docker rm -f egfr-codebuild || true

  post_build:
    commands:
      - |
        set -eu
        if [ "$CODEBUILD_BUILD_SUCCEEDING" != "1" ]; then
          echo "Build or tests failed; skipping publication."
          exit 1
        fi

        REGISTRY="628160382840.dkr.ecr.ap-southeast-2.amazonaws.com"
        BUILD_UUID="${CODEBUILD_BUILD_ID##*:}"
        IMAGE_TAG="build-${CODEBUILD_BUILD_NUMBER}-${BUILD_UUID}"
        IMAGE_URI="$REGISTRY/egfr-qsar:$IMAGE_TAG"

        aws ecr get-login-password --region ap-southeast-2 |
          docker login --username AWS --password-stdin "$REGISTRY"

        docker tag egfr-sagemaker:codebuild "$IMAGE_URI"
        docker push "$IMAGE_URI"

        aws ecr batch-get-image \
          --repository-name egfr-qsar \
          --image-ids imageTag="$IMAGE_TAG" \
          --region ap-southeast-2 \
          --query 'images[0].{Digest:imageId.imageDigest,MediaType:imageManifestMediaType}' \
          --output json

        echo "Published image $IMAGE_URI"
